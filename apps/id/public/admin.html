<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console · Signify ID</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"></span><span class="brand-name">Signify ID</span></div>

    <div class="field" id="tenantPickerWrap" hidden style="margin:0 .5rem">
      <label for="tenantPicker">School</label>
      <select id="tenantPicker"></select>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group">School</div>
      <button data-page="overview" class="active">Overview</button>
      <button data-page="users" data-needs="core:view_directory">People</button>
      <button data-page="classes" data-needs="core:manage_classes@own">Classes</button>
      <button data-page="substitutes" data-needs="core:manage_users">Substitutes</button>
      <button data-page="guardians" data-needs="core:manage_guardians">Parents</button>
      <button data-page="places" data-needs="core:manage_places">Places</button>
      <button data-page="roles" data-needs="core:view_directory|core:manage_roles">Roles</button>
      <button data-page="features" data-needs="core:manage_roles">Tools by role</button>
      <div class="nav-group" id="appsGroup" hidden>Apps</div>
      <button data-page="whiteboard" hidden>Whiteboard</button>
      <div class="nav-group">Governance</div>
      <button data-page="reports" hidden>Problem reports</button>
      <button data-page="audit" data-needs="core:view_audit">Audit log</button>
      <button data-page="compliance" data-needs="core:view_audit|core:manage_tenants">Compliance</button>
      <button data-page="backups" data-needs="core:manage_backups">Backups</button>
      <div class="nav-group" data-super>Platform</div>
      <button data-page="requests" data-super>Requests</button>
      <button data-page="tenants" data-super>Schools</button>
      <button data-page="apps" data-super>Applications</button>
      <button data-page="platform" data-super>Super admins</button>
    </nav>

    <div class="whoami">
      <div id="whoName" style="font-weight:600"></div>
      <div class="email" id="whoEmail"></div>
      <div style="margin-top:.4rem;display:flex;align-items:center;gap:.4rem">
        <span class="chip chip-blue" id="whoRole"></span>
        <a class="btn btn-sm btn-quiet" href="/logout" style="margin-left:auto">Sign out</a>
      </div>
      <button class="btn btn-sm btn-quiet report-own" id="reportOwn" type="button">Report a problem</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">Loading…</div>
  </main>
</div>

<div id="noticeRoot"></div>
<div id="modalRoot"></div>
<script src="/js/admin.js"></script>
<!-- The fleet's shared "Report a problem" form. No app grid here (empty apps
     endpoint); reports go through the console's own session-backed route. -->
<script src="/vendor/signify-switcher.js" data-apps-endpoint="" data-report-endpoint="/api/admin/reports/new" defer></script>
</body>
</html>
