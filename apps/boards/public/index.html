<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signify Learning</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="landing">
  <div class="landing-card">
    <h1>Signify Learning</h1>
    <p class="subtitle">Draw together. Teachers see every board live.</p>

    <div id="auth-section" hidden>
      <div id="gsi-button"></div>
      <div id="signed-in" hidden>
        <span id="signed-in-label"></span>
        <button id="signout-btn" type="button">Sign out</button>
      </div>
      <a id="admin-portal-link" href="/admin.html" hidden>Open admin portal</a>
    </div>

    <div id="join-section">
      <div class="role-tabs">
        <button id="tab-teacher" class="role-tab active" type="button">I'm the Teacher</button>
        <button id="tab-student" class="role-tab" type="button">I'm a Student</button>
      </div>

      <div id="name-field">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" maxlength="30" placeholder="e.g. Ms. Suarez" autocomplete="off" />
      </div>

      <label for="room-input">Room code</label>
      <div class="room-row">
        <input id="room-input" type="text" maxlength="12" placeholder="e.g. MATH1" autocomplete="off" />
        <button id="gen-btn" type="button" title="Generate a new room code">🎲</button>
      </div>

      <button id="join-btn" class="primary-btn" type="button">Start Whiteboard</button>
    </div>

    <p id="landing-error" class="error" hidden></p>

    <div id="my-rooms" hidden>
      <h2>My classrooms</h2>
      <ul id="my-rooms-list"></ul>
      <div class="room-row" id="new-room-row" hidden>
        <input id="new-room-name" type="text" maxlength="50" placeholder="New classroom name" />
        <button id="new-room-btn" type="button" title="Create a classroom">＋</button>
      </div>
    </div>

    <div id="personal-boards" hidden>
      <h2>My boards <span class="h2-note">(not in a class)</span></h2>
      <ul id="personal-boards-list"></ul>
      <button id="new-personal-btn" type="button" class="ghost-btn">＋ New personal board</button>
    </div>

    <div id="recent-rooms" hidden>
      <h2>All rooms (admin)</h2>
      <ul id="rooms-list"></ul>
    </div>
  </div>

  <script>
    const tabTeacher = document.getElementById('tab-teacher');
    const tabStudent = document.getElementById('tab-student');
    const nameInput = document.getElementById('name-input');
    const roomInput = document.getElementById('room-input');
    const genBtn = document.getElementById('gen-btn');
    const joinBtn = document.getElementById('join-btn');
    const errEl = document.getElementById('landing-error');

    let role = 'teacher';
    let cfg = { authEnabled: false };
    let session = JSON.parse(localStorage.getItem('wb-session') || 'null');
    if (session && session.exp && session.exp < Date.now()) {
      session = null;
      localStorage.removeItem('wb-session');
    }

    nameInput.value = localStorage.getItem('wb-name') || '';
    roomInput.value = localStorage.getItem('wb-room') || '';

    function showError(msg) {
      errEl.textContent = msg;
      errEl.hidden = !msg;
    }

    function isSuperSession() {
      return !!session && (session.isSuper || session.role === 'superadmin');
    }

    function sessionPerms() {
      if (!session) return [];
      if (Array.isArray(session.perms)) return session.perms;
      // Sessions issued before custom roles existed carry only a role name
      if (session.role === 'teacher') return ['teach'];
      if (session.role === 'admin' || session.role === 'superadmin') return ['teach', 'manage_users', 'manage_boards', 'view_sessions'];
      return [];
    }

    function setRole(r) {
      if (r === 'teacher' && session && session.role === 'student') return; // not allowed
      role = r;
      tabTeacher.classList.toggle('active', r === 'teacher');
      tabStudent.classList.toggle('active', r === 'student');
      genBtn.hidden = r !== 'teacher';
      joinBtn.textContent = r === 'teacher' ? 'Start Whiteboard' : 'Join Class';
      updateRecentVisibility();
    }
    tabTeacher.onclick = () => setRole('teacher');
    tabStudent.onclick = () => setRole('student');

    genBtn.onclick = () => {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      roomInput.value = Array.from({ length: 5 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    };

    function join() {
      const roomCode = roomInput.value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
      let name;
      if (cfg.authEnabled) {
        if (!session) { showError('Please sign in with your school Google account first.'); return; }
        name = session.name;
      } else {
        name = nameInput.value.trim();
        if (!name) { showError('Please enter your name.'); return; }
        localStorage.setItem('wb-name', name);
      }
      if (!roomCode) { showError('Please enter a room code.'); return; }
      localStorage.setItem('wb-room', roomCode);
      location.href = `/board.html?role=${role}&room=${encodeURIComponent(roomCode)}&name=${encodeURIComponent(name)}`;
    }
    joinBtn.onclick = join;
    document.body.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

    // ----- Google sign-in -----

    function renderGsiButton() {
      if (!window.google || !google.accounts) { setTimeout(renderGsiButton, 100); return; }
      google.accounts.id.initialize({ client_id: cfg.clientId, callback: onCredential });
      google.accounts.id.renderButton(document.getElementById('gsi-button'), {
        theme: 'outline', size: 'large', width: 320, text: 'signin_with',
      });
    }

    async function onCredential(resp) {
      showError('');
      try {
        const r = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: resp.credential }),
        });
        const d = await r.json();
        if (!r.ok) { showError(d.error || 'Sign-in failed.'); return; }
        session = d;
        localStorage.setItem('wb-session', JSON.stringify(d));
        applyAuthState();
      } catch {
        showError('Could not reach the server. Please try again.');
      }
    }

    document.getElementById('signout-btn').onclick = () => {
      session = null;
      localStorage.removeItem('wb-session');
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
      applyAuthState();
    };

    function applyAuthState() {
      const authSection = document.getElementById('auth-section');
      const joinSection = document.getElementById('join-section');
      const signedIn = document.getElementById('signed-in');
      const gsiButton = document.getElementById('gsi-button');

      if (!cfg.authEnabled) {
        authSection.hidden = true;
        joinSection.hidden = false;
        loadRooms();
        return;
      }
      authSection.hidden = false;
      document.getElementById('name-field').hidden = true;
      if (session) {
        gsiButton.hidden = true;
        signedIn.hidden = false;
        document.getElementById('signed-in-label').textContent = `Signed in as ${session.name} (${session.email})`;
        const perms = sessionPerms();
        document.getElementById('admin-portal-link').hidden = !(isSuperSession() || perms.some((p) => p !== 'teach'));
        joinSection.hidden = false;
        if (!isSuperSession() && !perms.includes('teach')) {
          setRole('student');
          tabTeacher.disabled = true;
          tabTeacher.title = 'Your account is not registered as a teacher';
        } else {
          tabTeacher.disabled = false;
        }
        loadRooms();
        loadMyRooms();
        loadPersonalBoards();
      } else {
        document.getElementById('admin-portal-link').hidden = true;
        document.getElementById('personal-boards').hidden = true;
        gsiButton.hidden = false;
        signedIn.hidden = true;
        joinSection.hidden = true;
        document.getElementById('recent-rooms').hidden = true;
        document.getElementById('my-rooms').hidden = true;
        renderGsiButton();
      }
    }

    // ----- recent rooms (teachers) -----

    let roomsLoaded = false;
    function updateRecentVisibility() {
      document.getElementById('recent-rooms').hidden = role !== 'teacher' || !roomsLoaded;
    }

    // ----- my classrooms (auth mode) -----

    async function loadMyRooms() {
      if (!cfg.authEnabled || !session) return;
      const wrap = document.getElementById('my-rooms');
      const canCreate = isSuperSession() || sessionPerms().includes('teach') || sessionPerms().includes('manage_boards');
      document.getElementById('new-room-row').hidden = !canCreate;
      try {
        const r = await fetch('/api/my/rooms', { headers: { Authorization: 'Bearer ' + session.token } });
        if (!r.ok) { wrap.hidden = !canCreate; return; }
        const d = await r.json();
        const ul = document.getElementById('my-rooms-list');
        ul.innerHTML = '';
        const items = [
          ...d.teaching.map((x) => ({ ...x, mode: 'teacher', tag: 'you teach' })),
          ...d.enrolled.filter((x) => !d.teaching.some((t) => t.code === x.code)).map((x) => ({ ...x, mode: 'student', tag: 'enrolled' })),
        ];
        for (const it of items) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="room-code"></span><span class="room-name"></span><span class="room-meta"></span>`;
          li.querySelector('.room-code').textContent = it.code;
          li.querySelector('.room-name').textContent = it.name || '';
          li.querySelector('.room-meta').textContent = `${it.tag} · ${it.students} student${it.students === 1 ? '' : 's'}`;
          li.onclick = () => {
            location.href = `/board.html?role=${it.mode}&room=${encodeURIComponent(it.code)}&name=${encodeURIComponent(session.name)}`;
          };
          ul.appendChild(li);
        }
        wrap.hidden = !items.length && !canCreate;
      } catch {
        wrap.hidden = !canCreate;
      }
    }

    // ----- personal boards (no class) -----

    async function loadPersonalBoards() {
      if (!cfg.authEnabled || !session) return;
      const wrap = document.getElementById('personal-boards');
      try {
        const r = await fetch('/api/boards/personal', { headers: { Authorization: 'Bearer ' + session.token } });
        if (!r.ok) return;
        const boards = await r.json();
        const ul = document.getElementById('personal-boards-list');
        ul.innerHTML = '';
        for (const b of boards.slice(0, 10)) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="room-name"></span><span class="room-meta"></span>`;
          li.querySelector('.room-name').textContent = b.title;
          li.querySelector('.room-meta').textContent = b.updatedAt ? new Date(b.updatedAt).toLocaleDateString() : '';
          li.onclick = () => { location.href = `/board.html?board=${encodeURIComponent(b.id)}`; };
          ul.appendChild(li);
        }
        wrap.hidden = false;
      } catch { /* section stays hidden */ }
    }

    document.getElementById('new-personal-btn').onclick = async () => {
      try {
        const r = await fetch('/api/boards/personal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
          body: JSON.stringify({}),
        });
        const d = await r.json();
        if (!r.ok) { showError(d.error || 'Could not create the board.'); return; }
        location.href = `/board.html?board=${encodeURIComponent(d.id)}`;
      } catch {
        showError('Could not reach the server.');
      }
    };

    document.getElementById('new-room-btn').onclick = async () => {
      const name = document.getElementById('new-room-name').value.trim();
      if (!name) { showError('Give your classroom a name first.'); return; }
      try {
        const r = await fetch('/api/rooms/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
          body: JSON.stringify({ name }),
        });
        const d = await r.json();
        if (!r.ok) { showError(d.error || 'Could not create the classroom.'); return; }
        location.href = `/board.html?role=teacher&room=${encodeURIComponent(d.code)}&name=${encodeURIComponent(session.name)}`;
      } catch {
        showError('Could not reach the server.');
      }
    };

    function loadRooms() {
      if (cfg.authEnabled && (!session || (!isSuperSession() && !sessionPerms().includes('manage_boards')))) return;
      const headers = session ? { Authorization: 'Bearer ' + session.token } : {};
      fetch('/api/rooms', { headers }).then((r) => (r.ok ? r.json() : [])).then((roomsData) => {
        const ul = document.getElementById('rooms-list');
        ul.innerHTML = '';
        if (!roomsData.length) return;
        roomsLoaded = true;
        roomsData.slice(0, 8).forEach((r) => {
          const li = document.createElement('li');
          const when = r.updatedAt ? new Date(r.updatedAt).toLocaleDateString() : '';
          li.innerHTML = `<span class="room-code"></span><span class="room-meta">${r.students} student board${r.students === 1 ? '' : 's'} · ${when}</span>`;
          li.querySelector('.room-code').textContent = r.code;
          li.onclick = () => { roomInput.value = r.code; setRole('teacher'); join(); };
          ul.appendChild(li);
        });
        updateRecentVisibility();
      }).catch(() => {});
    }

    fetch('/api/config')
      .then((r) => r.json())
      .then((c) => { cfg = c; applyAuthState(); })
      .catch(() => applyAuthState());
  </script>
</body>
</html>
